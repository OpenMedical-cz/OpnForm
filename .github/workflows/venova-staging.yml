name: Venova staging release

on:
  workflow_call:

permissions:
  contents: read
  packages: write

concurrency:
  group: venova-staging-delivery
  cancel-in-progress: false

jobs:
  images:
    if: github.repository == 'OpenMedical-cz/OpnForm' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      api: ${{ steps.api.outputs.digest }}
      client: ${{ steps.client.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build API image
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          platforms: linux/amd64
          push: true
          tags: ghcr.io/openmedical-cz/opnform-api:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=venova-api
          cache-to: type=gha,scope=venova-api,mode=max
      - name: Build client image
        id: client
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.client
          platforms: linux/amd64
          push: true
          tags: ghcr.io/openmedical-cz/opnform-client:${{ github.sha }}
          cache-from: type=gha,scope=venova-client
          cache-to: type=gha,scope=venova-client,mode=max
      - name: Write immutable staging release manifest
        env:
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
          API_DIGEST: ghcr.io/openmedical-cz/opnform-api@${{ steps.api.outputs.digest }}
          CLIENT_DIGEST: ghcr.io/openmedical-cz/opnform-client@${{ steps.client.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = {
              'source_run_id': os.environ['SOURCE_RUN_ID'],
              'source_sha': os.environ['SOURCE_SHA'],
              'api_digest': os.environ['API_DIGEST'],
              'client_digest': os.environ['CLIENT_DIGEST'],
          }
          Path('release.json').write_text(json.dumps(manifest, separators=(',', ':'), sort_keys=True) + '\n')
          PY
      - name: Upload immutable staging release manifest
        uses: actions/upload-artifact@v4
        with:
          name: venova-staging-release
          path: release.json
          if-no-files-found: error
          retention-days: 14

  dispatch-private-staging:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch private staging workflow with the source run ID
        env:
          DISPATCH_TOKEN: ${{ secrets.VENOVA_DEPLOY_DISPATCH_TOKEN }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          token = os.environ.get('DISPATCH_TOKEN', '')
          run_id = os.environ.get('SOURCE_RUN_ID', '')
          if not token or not run_id.isdecimal():
              raise SystemExit('Missing private workflow dispatch configuration')
          request = Request(
              'https://api.github.com/repos/OpenMedical-cz/venova-opnform-deploy/actions/workflows/staging.yml/dispatches',
              data=json.dumps({'ref': 'main', 'inputs': {'source_run_id': run_id}}).encode('utf-8'),
              method='POST',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': 'Bearer ' + token,
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'venova-opnform-release',
                  'Content-Type': 'application/json',
              },
          )
          with urlopen(request, timeout=30) as response:
              if response.status != 204:
                  raise SystemExit('Private staging workflow dispatch failed')
          PY
