name: opnform-stg

x-service: &service
  restart: "no"
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

x-api: &api
  <<: *service
  image: ${API_IMAGE:?Set the API image digest}
  # Stop startup on failed upstream initialization, including migrations.
  entrypoint: ["bash", "-e", "/usr/local/bin/opnform-entrypoint"]
  env_file:
    - ${OPNFORM_RUNTIME_FILE:-/etc/opnform/stg/runtime.env}
    - ${OPNFORM_SMTP_FILE:-/etc/opnform/stg/smtp.env}
  environment:
    APP_ENV: production
    APP_DEBUG: "false"
    APP_KEY: ${APP_KEY:?Set the Laravel application key}
    APP_URL: https://stg-forms.venova.cz/api
    FRONT_URL: https://stg-forms.venova.cz
    DB_CONNECTION: pgsql
    DB_HOST: db
    DB_PORT: "5432"
    DB_DATABASE: opnform
    DB_USERNAME: opnform
    DB_PASSWORD: ${DB_PASSWORD:?Set a staging database password}
    REDIS_HOST: redis
    QUEUE_CONNECTION: redis
    CACHE_DRIVER: redis
    SESSION_DRIVER: redis
    SESSION_SECURE_COOKIE: "true"
    FILESYSTEM_DRIVER: local
    FILESYSTEM_CLOUD: local
    LOCAL_FILESYSTEM_VISIBILITY: private
    TRUSTED_PROXIES: "*"
    PHP_MEMORY_LIMIT: 256M
    PHP_MAX_EXECUTION_TIME: "120"
    PHP_UPLOAD_MAX_FILESIZE: 64M
    PHP_POST_MAX_SIZE: 64M
  volumes:
    - type: bind
      source: /mnt/HC_Volume_106834335/opnform/storage
      target: /usr/share/nginx/html/storage
      bind:
        create_host_path: false
  networks: [data, outbound]
  mem_limit: 512m

services:
  db:
    <<: *service
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: opnform
      POSTGRES_USER: opnform
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set a staging database password}
    volumes:
      - type: bind
        source: /mnt/HC_Volume_106834335/opnform/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    networks: [data]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opnform -d opnform"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    <<: *service
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - type: bind
        source: /mnt/HC_Volume_106834335/opnform/redis
        target: /data
        bind:
          create_host_path: false
    networks: [data]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    <<: *api
    command: ["php-fpm"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan about >/dev/null 2>&1 && php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s

  worker:
    <<: *api
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=60"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'php artisan queue:work' >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3

  scheduler:
    <<: *api
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "artisan", "app:scheduler-status", "--mode=check", "--max-minutes=3"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 70s

  ui:
    <<: *service
    image: ${CLIENT_IMAGE:?Set the client image digest}
    environment:
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "3000"
      NUXT_PUBLIC_APP_URL: https://stg-forms.venova.cz
      NUXT_PUBLIC_API_BASE: https://stg-forms.venova.cz/api
      NUXT_PUBLIC_ENV: production
      NUXT_PUBLIC_CODEX_AUTO_LOGIN: "false"
      NUXT_API_SECRET: ${FRONT_API_SECRET:?Set the shared frontend API secret}
    networks: [outbound]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  ingress:
    <<: *service
    image: nginx:stable-alpine
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:3080:80"
    networks: [outbound]
    mem_limit: 128m
    depends_on:
      api:
        condition: service_healthy
      ui:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && wget --spider -q http://127.0.0.1/login"]
      interval: 10s
      timeout: 5s
      retries: 6

networks:
  data:
    internal: true
  outbound: {}
