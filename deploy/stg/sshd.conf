Match User opnform-deploy
    AuthorizedKeysFile /etc/ssh/authorized_keys/opnform-deploy
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    DisableForwarding yes
    PermitTTY no
    PermitUserRC no
    ForceCommand /usr/local/libexec/opnform-stg-ssh-command
Match all
